name: Build Chimera v4 Overlay

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0'

concurrency:
  group: chimera-overlay
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout cports
        uses: actions/checkout@v4

      - name: Free GitHub Actions Disk Space
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo apt-get clean
          
          # Setup 8GB swap space to protect against Out-Of-Memory (OOM) crashes
          sudo swapoff -a || true
          sudo fallocate -l 8G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      - name: Persistent Compiler Cache Restore
        uses: actions/cache/restore@v4
        with:
          path: cbuild_cache/ccache
          key: chimera-ccache-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            chimera-ccache-${{ runner.os }}-

      - name: Install Build Dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y python3 bubblewrap bmake openssl git curl flake8 black
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_unconfined=0
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          curl -sSL "https://repo.chimera-linux.org/apk/latest/apk-x86_64.static" -o apk
          echo "b11f0bf10f4c2697f3c9f7c54f84db1a6dfbb26efc33554435aa3b1cd5535043  apk" | sha256sum -c -
          chmod +x apk
          sudo mv apk /usr/local/bin/apk

      - name: Import Signing Key
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/keys"
          echo "${{ secrets.SIGNING_KEY }}" | base64 -d > "${RUNNER_TEMP}/keys/repo.rsa"
          chmod 600 "${RUNNER_TEMP}/keys/repo.rsa"
          openssl rsa -in "${RUNNER_TEMP}/keys/repo.rsa" -pubout -out "${RUNNER_TEMP}/keys/repo.rsa.pub"

      - name: Configure Architecture Flags
        run: |
          set -euo pipefail
          mkdir -p etc
          cat << EOF > etc/config.ini
          [build]
          cflags = "-O2 -march=x86-64-v4 -pipe"
          cxxflags = "-O2 -march=x86-64-v4 -pipe"
          ldflags = "-fuse-ld=lld"
          jobs = 2
          ccache = yes
          check = no

          [signing]
          key = ${RUNNER_TEMP}/keys/repo.rsa
          EOF

      - name: Setup Chimera cbuild
        run: |
          set -euo pipefail
          ./cbuild bootstrap

      - name: Apply Kernel Config Overlay
        run: |
          set -euo pipefail

          # Extract exactly Major.Minor (e.g. 7.0) because CachyOS branches do not use 7.0.10
          KVER=$(sed -E -n "s/^pkgver *= *['\"]([0-9]+)\.([0-9]+).*/\1.\2/p" main/linux-stable/template.py)
          if [[ -z "${KVER}" ]]; then
            echo "ERROR: could not read pkgver from main/linux-stable/template.py"
            exit 1
          fi
          echo "Kernel base version detected: ${KVER}"

          # Fetch BORE patch for this kernel version at build time
          mkdir -p main/linux-stable/patches
          TEMP_PATCH=$(mktemp)
          if curl -fsSL "https://raw.githubusercontent.com/CachyOS/kernel-patches/master/${KVER}/sched/0001-bore.patch" -o "$TEMP_PATCH"; then
            mv "$TEMP_PATCH" main/linux-stable/patches/0001-bore.patch
            echo "Downloaded BORE patch for ${KVER}"
          else
            echo "WARNING: No BORE patch available for ${KVER}"
            echo "Building kernel without BORE scheduler."
            rm -f "$TEMP_PATCH"
          fi

          # Patch cbuild's patch engine for fuzzy (-F 3) patching
          python3 << 'PY'
          import sys
          import subprocess
          
          path = "src/cbuild/util/patch.py"
          with open(path) as f:
              content = f.read()
          
          if "import subprocess" not in content:
              content = "import subprocess\n" + content
          
          target = "\n".join([
              "    def _apply(p):",
              '        if not git.call([*srcmd, p], cwd=pkg.srcdir, foreground=True):',
              '            pkg.error(f"failed to apply \'{p.name}\'")'
          ])
          
          replacement = "\n".join([
              "    def _apply(p):",
              "        try:",
              '            subprocess.run(["patch", "-p1", "-F", "3", "-i", str(p)], cwd=pkg.srcdir, check=True)',
              "        except Exception:",
              '            pkg.error(f"failed to apply \'{p.name}\'")'
          ])
          
          if target in content:
              content = content.replace(target, replacement)
              with open(path, 'w') as f:
                  f.write(content)
              print("Patched patch.py successfully")
          elif replacement in content:
              print("patch.py already patched")
          else:
              print("ERROR: Could not find _apply block to replace")
              sys.exit(1)
          PY

          cat << 'EOF' > main/linux-stable/files/custom-overlay.config
          CONFIG_SCHED_BORE=y
          CONFIG_HZ_1000=y
          # CONFIG_HZ_300 is not set
          # CONFIG_HZ_250 is not set
          CONFIG_LTO_CLANG_THIN=y
          CONFIG_PREEMPT_DYNAMIC=y
          # Strip massive GPU drivers to save memory/compile-time
          # CONFIG_DRM_AMDGPU is not set
          # CONFIG_DRM_RADEON is not set
          # CONFIG_DRM_NOUVEAU is not set
          EOF

          if [[ ! -f "main/linux-stable/patches/0001-bore.patch" ]]; then
            sed -i 's/^CONFIG_SCHED_BORE=y/# CONFIG_SCHED_BORE is not set/' main/linux-stable/files/custom-overlay.config
          fi

          sed -i '/CONFIG_DRM_AMDGPU/d' main/linux-stable/files/config-x86_64.generic
          sed -i '/CONFIG_DRM_RADEON/d' main/linux-stable/files/config-x86_64.generic
          sed -i '/CONFIG_DRM_NOUVEAU/d' main/linux-stable/files/config-x86_64.generic
          cat main/linux-stable/files/custom-overlay.config >> main/linux-stable/files/config-x86_64.generic

      - name: Strip AMD and Nvidia from Mesa
        run: |
          set -euo pipefail
          python3 << 'PY'
          import re

          path = "main/mesa/template.py"
          with open(path) as f:
              content = f.read()

          # Replace boolean flags robustly
          for flag in ["_have_nvidia", "_have_amd", "_have_vmware", "_have_virgl", "_have_hwdec"]:
              content = re.sub(rf'({flag}\s*=\s*)True', r'\1False', content)

          # Replace _have_opencl expression
          content = re.sub(r'(_have_opencl\s*=\s*)[^\n]+', r'\1False', content)

          # Handle the radv defaults conf file conditionally
          content = re.sub(
              r'("usr/share/drirc\.d/00-radv-defaults\.conf")\s*,',
              r'*([\1] if _have_amd else []),',
              content
          )

          # Add missing compiler requirements for intel_clc
          content += "\nmakedepends += [\"libclc\", \"spirv-llvm-translator-devel\", \"spirv-tools-devel\"]\n"

          with open(path, 'w') as f:
              f.write(content)
          PY
          
          # Fix formatting so cbuild doesn't reject our modified template
          black main/mesa/template.py

      - name: Build Overlay Packages
        run: |
          set -euo pipefail
          # Limit build step to 320m to allow cache save before 360m runner timeout
          timeout 320m bash -c '
            for pkg in \
              main/openssl3 \
              main/zstd \
              main/mesa \
              main/ffmpeg \
              main/linux-stable
            do
              echo "::group::Building ${pkg}"
              ./cbuild pkg "${pkg}"
              echo "::endgroup::"
            done
          '

      - name: Persistent Compiler Cache Save
        if: always()
        uses: actions/cache/save@v4
        with:
          path: cbuild_cache/ccache
          key: chimera-ccache-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload Build Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chimera-overlay-packages
          path: packages/
          if-no-files-found: warn

      - name: Deploy Overlay
        run: |
          set -euo pipefail
          if [ -d packages ] && find packages -name '*.apk' | head -n 1 | grep -q .; then
            echo "Packages found, deploying..."
          else
            echo "No packages produced."
            exit 0
          fi

          # Delete large debug symbol packages to prevent pushing gigabytes to GitHub Pages
          find packages -name '*-dbg-*.apk' -delete

          # Initialize a clean repository and force-push directly
          mkdir -p deploy-repo
          cd deploy-repo
          git init
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config --global http.postBuffer 524288000
          
          # Copy packages and the public key
          cp -r ../packages/* .
          cp "${RUNNER_TEMP}/keys/repo.rsa.pub" .
          
          # Add, commit and force-push directly to the gh-pages branch
          git checkout -b gh-pages
          git add .
          git commit -m "Overlay Build: Kernel (BORE/ThinLTO), Mesa, FFmpeg, Zstd, OpenSSL (x86-64-v4)"
          git remote add origin "https://x-access-token:${{ secrets.REPO_PAT }}@github.com/${{ github.repository_owner }}/chimera-v4-repo.git"
          git push -f origin gh-pages
