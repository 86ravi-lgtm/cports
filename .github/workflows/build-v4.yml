name: Build Chimera v4 Overlay

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0' 

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout cports
        uses: actions/checkout@v4

      - name: Persistent Compiler Cache
        uses: actions/cache@v3
        with:
          path: bldroot/ccache
          key: chimera-ccache-${{ github.run_id }}
          restore-keys: |
            chimera-ccache-

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 bubblewrap bmake openssl git curl flake8 black
          # Disable Ubuntu 24.04 AppArmor restrictions so Bubblewrap can create namespaces
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_unconfined=0
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          # Download Chimera's native apk-tools v3 binary which supports ADB compression
          curl -sSL "https://repo.chimera-linux.org/apk/latest/apk-x86_64.static" -o apk
          sudo chown $(whoami) apk
          sudo chmod +x apk
          sudo mv apk /usr/local/bin/apk

      - name: Import Signing Key
        run: |
          mkdir -p etc/keys
          echo "${{ secrets.SIGNING_KEY }}" > etc/keys/repo.rsa

      - name: Configure Architecture Flags
        run: |
          mkdir -p etc
          cat << 'EOF' > etc/config.ini
          [build]
          cflags = "-O2 -march=x86-64-v4 -pipe"
          cxxflags = "-O2 -march=x86-64-v4 -pipe"
          
          [signing]
          key = etc/keys/repo.rsa
          EOF

      - name: Setup Chimera cbuild
        run: ./cbuild bootstrap

      - name: Configure Kernel (BORE, ThinLTO, HZ=1000)
        run: |
          mkdir -p main/linux-stable/patches
          curl -sSL "https://raw.githubusercontent.com/CachyOS/kernel-patches/master/6.12/sched/0001-bore-cachy.patch" > main/linux-stable/patches/0001-bore.patch
          
          cat << 'EOF' > main/linux-stable/files/custom-overlay.config
          CONFIG_SCHED_BORE=y
          CONFIG_HZ_1000=y
          # CONFIG_HZ_300 is not set
          # CONFIG_HZ_250 is not set
          CONFIG_LTO_CLANG_THIN=y
          CONFIG_PREEMPT_DYNAMIC=y
          EOF
          
          cat main/linux-stable/files/custom-overlay.config >> main/linux-stable/files/config-x86_64.generic
          
      - name: Build Overlay Packages
        run: |
          ./cbuild pkg main/openssl3
          ./cbuild pkg main/zstd
          ./cbuild pkg main/mesa
          ./cbuild pkg main/ffmpeg
          ./cbuild pkg main/linux-stable
          

      - name: Failure Recovery Backup
        uses: actions/upload-artifact@v4
        with:
          name: chimera-overlay-packages
          path: packages/
          
      - name: Checkout Hosting Repository
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/chimera-v4-repo
          token: ${{ secrets.REPO_PAT }}
          path: chimera-v4-repo
          
      - name: Deploy Overlay
        run: |
          cp -r packages/* chimera-v4-repo/
          cd chimera-v4-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --orphan gh-pages
          git add .
          git commit -m "10/10 Overlay Build: Kernel (BORE/ThinLTO), Mesa, FFmpeg, Zstd, OpenSSL (x86-64-v4)"
          git push -f origin gh-pages
